name: Generate debian package

on: [push, pull_request]

env:
  PERSIST_DIR: /srv/gh-runners/quic-qrb-ros
  DL_DIR: /srv/gh-runners/quic-qrb-ros/downloads
  WORKSPACE: ${{ github.workspace }}/ros_ws
  SDK_DIR: ${{ github.workspace }}/sdk
  QCOM_SELECTED_BSP: custom

jobs:
  build_debian:
    runs-on: [ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ${WORKSPACE}

      - name: Print
        run: |
          ls ${WORKSPACE}
          echo "===="
          ls ${{ github.workspace }}

      - name: Build
        uses: jiaxshi/Sample@debian-build
        with:
          src-dir: ${WORKSPACE}
